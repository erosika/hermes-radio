[project]
name = "hermes-radio"
version = "0.2.0"
description = "Internet radio for Hermes Agent: one mpv daemon shared by the agent tools, /radio, the classic-CLI wrapper, and the TUI dock"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "erosika" }]
dependencies = [
    "httpx",
    "pyyaml",
]

[project.optional-dependencies]
hermes = [
    "hermes-agent",
]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.urls]
Homepage = "https://github.com/erosika/hermes-radio"

[project.scripts]
hermes-radio = "hermes_radio.cli:main"
hermes-radio-daemon = "hermes_radio.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_radio"]

[tool.uv]
exclude-newer = "5 days"

[tool.uv.exclude-newer-package]
honcho-ai = "0 days"
